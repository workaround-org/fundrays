# =============================================================================
# Datasource
# =============================================================================
# Dev uses Quarkus Dev Services (auto-starts a PostgreSQL container).
quarkus.datasource.db-kind=postgresql

# =============================================================================
# Hibernate ORM / schema management
# =============================================================================
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=validate

# import.sql only runs in dev; tests start with a clean schema.
%test.quarkus.hibernate-orm.import-files=

# =============================================================================
# Authentication / HTTP security
# =============================================================================
# Form-based authentication for the admin web UI.
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login
quarkus.http.auth.form.error-page=/login?error=true
quarkus.http.auth.form.landing-page=/admin

# Tests use @TestSecurity or basic auth - form auth redirect breaks REST API auth tests.
%test.quarkus.http.auth.form.enabled=false

# Keep Basic auth so REST API clients still receive 401 (not a 302 redirect).
quarkus.http.auth.basic=true

# CSRF: skip verification for non-form (JSON) requests so the REST API is unaffected.
# Renarde HTML form submissions use application/x-www-form-urlencoded and are still verified.
quarkus.rest-csrf.require-form-url-encoded=false

# =============================================================================
# Application
# =============================================================================
# Base URL used to build absolute og:image URLs. Must end with /.
# Override in production: FUNDRAYS_BASE_URL=https://your-domain.com/
fundrays.base-url=http://localhost:8080/
quarkus.banner.path=banner.txt

# =============================================================================
# Mollie payment gateway
# =============================================================================
# Dev/prod: set FUNDRAYS_MOLLIE_API_KEY=test_... or live_... in .env or environment.
# In production also set FUNDRAYS_MOLLIE_ENABLED=true.
fundrays.mollie.enabled=${FUNDRAYS_MOLLIE_ENABLED:false}
fundrays.mollie.api-key=${FUNDRAYS_MOLLIE_API_KEY:test_placeholder}

# Dev mode: enable Mollie automatically when the key is provided via .env.
%dev.fundrays.mollie.enabled=true

# Deterministic Mollie configuration for unit tests. The gateway itself is mocked.
%test.fundrays.mollie.enabled=true
%test.fundrays.mollie.api-key=test_placeholder
