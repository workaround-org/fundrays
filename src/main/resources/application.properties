# Datasource - dev uses Quarkus Dev Services (auto-starts a PostgreSQL container)
quarkus.datasource.db-kind=postgresql

# Schema management
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%prod.quarkus.hibernate-orm.database.generation=validate

# SQL logging in dev
%dev.quarkus.hibernate-orm.log.sql=true

# import.sql only runs in dev; tests start with a clean schema
%test.quarkus.hibernate-orm.import-files=

# Form-based authentication for the admin web UI
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login
quarkus.http.auth.form.error-page=/login?error=true
quarkus.http.auth.form.landing-page=/admin

# Keep Basic auth so REST API clients still receive 401 (not a 302 redirect)
quarkus.http.auth.basic=true

# Tests use @TestSecurity or basic auth - form auth redirect breaks REST API auth tests
%test.quarkus.http.auth.form.enabled=false

# CSRF: skip verification for non-form (JSON) requests so the REST API is unaffected.
# Renarde HTML form submissions use application/x-www-form-urlencoded and are still verified.
quarkus.rest-csrf.require-form-url-encoded=false

# Base URL used to build absolute og:image URLs. Must end with /.
# Override in production: FUNDRAYS_BASE_URL=https://your-domain.com/
fundrays.base-url=http://localhost:8080/

# Wero gateway. Disabled by default - the donation page hides Wero until
# WERO_ENABLED=true and the secrets below are supplied through environment
# variables. With a blank api-key, payment initiation fails fast; with a
# blank webhook-secret, all webhook callbacks are rejected.
fundrays.wero.enabled=false
fundrays.wero.api-key=test-api-key
fundrays.wero.webhook-secret=test-webhook-secret
quarkus.rest-client.wero-api.url=http://localhost:9090
quarkus.rest-client.wero-api.scope=jakarta.enterprise.context.ApplicationScoped
quarkus.rest-client.wero-api.connect-timeout=3000
quarkus.rest-client.wero-api.read-timeout=10000

# Deterministic Wero configuration for tests. The gateway itself is mocked.
%test.fundrays.wero.enabled=true
