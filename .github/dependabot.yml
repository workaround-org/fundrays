version: 2
updates:
  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # GitHub-owned actions (checkout, setup-java, cache)
      github-core:
        patterns:
          - "actions/*"
      # Docker-owned actions (buildx, login, metadata, build-push)
      docker-actions:
        patterns:
          - "docker/*"

  # Maven dependencies and plugins
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      # Quarkus platform BOM, extensions, and Quarkiverse add-ons
      quarkus:
        patterns:
          - "io.quarkus:*"
          - "io.quarkiverse*:*"
      # Test-scope libraries
      test:
        patterns:
          - "io.rest-assured:*"
      # Maven build and code-quality plugins
      build-plugins:
        patterns:
          - "net.revelc.code.formatter:*"
          - "org.apache.maven.plugins:*"

  # Docker base image (UBI minimal used in Dockerfile.native)
  - package-ecosystem: docker
    directory: /src/main/docker
    schedule:
      interval: weekly
